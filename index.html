<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LearnScroll">
  <title>LearnScroll</title>
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background-color: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden; 
    }
    .feed {
      height: 100vh; height: 100dvh; 
      overflow-y: scroll; scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .card {
      height: 100%; width: 100%; scroll-snap-align: start;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      padding: 30px; box-sizing: border-box; text-align: center;
    }
    .title { font-size: 32px; font-weight: bold; margin-bottom: 20px; }
    .content { font-size: 22px; line-height: 1.5; color: #e0e0e0; }
    
    /* We moved the vocab styling here so it's controlled in one place! */
    .vocab-box {
      margin-top: 20px; font-size: 16px; background: rgba(0,0,0,0.3); 
      padding: 12px; border-radius: 8px; text-align: left; line-height: 1.4;
    }
    .vocab-word { color: #ffd700; font-weight: bold; }
  </style>
</head>
<body>
  <!-- This is the empty feed. The script below will fill it! -->
  <div class="feed" id="feed"></div>

  <!-- This links to your new data file -->
  <script src="cards.js"></script>
  
  <script>
    const feed = document.getElementById('feed');

    // 1. Shuffle the deck
    const shuffledCards = myCards.sort(() => Math.random() - 0.5);

    // 2. Build the HTML for each card automatically
    shuffledCards.forEach(card => {
      const cardDiv = document.createElement('div');
      cardDiv.className = 'card';
      cardDiv.style.background = card.color;
      
      let innerHTML = `<div class="title">${card.title}</div>
                       <div class="content">${card.body}<br><br>- ${card.source}`;
      
      // If the card has vocab words, build the vocab box
      if (card.vocab && card.vocab.length > 0) {
        innerHTML += `<div class="vocab-box"><strong>📖 Quick Vocab:</strong><br>`;
        card.vocab.forEach(v => {
          innerHTML += `<span class="vocab-word">${v.word}:</span> ${v.def}<br>`;
        });
        innerHTML += `</div>`;
      }
      
      innerHTML += `</div>`;
      cardDiv.innerHTML = innerHTML;
      feed.appendChild(cardDiv);
    });
  </script>
</body>
</html>
